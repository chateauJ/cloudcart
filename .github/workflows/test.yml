name: test

on:
  pull_request:
    branches: [main]
  workflow_call: # deploy.yml reruns these exact checks before it touches AWS

# Every job here is read-only: no AWS credentials, and the GITHUB_TOKEN can only read the repo
permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its stale run; calls from deploy.yml get a unique group and never cancel
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24" # matches the Lambda runtime, nodejs24.x
  TERRAFORM_VERSION: "1.14.8"
  TFLINT_VERSION: "v0.64.0"

jobs:
  backend:
    name: Backend - typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage # fails the job if coverage drops below jest.config.js's floor
      - run: npm run build # proves every Lambda bundles, the same step a deploy runs

  frontend:
    name: Frontend - lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Catches anything a static export can't serve (a dynamic route, a server-only API) before merge.
      # Placeholder values: the build only inlines them, and nothing here calls the API.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder
          NEXT_PUBLIC_TENANT_ID: placeholder

  terraform-lint:
    name: Terraform - fmt, tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: terraform fmt -check -recursive -diff
      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/infrastructure/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download from GitHub releases, avoids anonymous rate limits
      # --recursive lints every module directory; one shared config instead of a copy per directory
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/infrastructure/.tflint.hcl" --format compact

  terraform-validate:
    name: Terraform - validate ${{ matrix.root }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, environments/dev, environments/prod] # each root module separately, as each has its own providers and state
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # -backend=false: validate needs providers and modules, not state, so no AWS credentials are involved
      - run: terraform init -backend=false -input=false
      - run: terraform validate
