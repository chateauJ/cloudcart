name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # rerun a deploy from the Actions tab without a new commit

permissions:
  contents: read

concurrency:
  # Deploys queue instead of cancelling: interrupting terraform apply can leave state locked mid-write
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true" # trims terraform's "run this next" hints from the logs
  TF_INPUT: "false" # fail on a missing variable instead of hanging on a prompt

jobs:
  test:
    uses: ./.github/workflows/test.yml # the same checks a PR ran, so main can't deploy what a PR wouldn't pass

  deploy-dev:
    name: Deploy dev
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: dev # the role's trust policy accepts this job's token only because of this line
      url: ${{ steps.terraform.outputs.api_url }}
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token it trades for AWS credentials
    outputs:
      api_url: ${{ steps.terraform.outputs.api_url }}
      cognito_client_id: ${{ steps.terraform.outputs.cognito_client_id }}
    env:
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }} # repository secret - stands in for the gitignored local.auto.tfvars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: terraform
        uses: ./.github/actions/terraform
        with:
          environment: dev
          apply: "true"
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

  smoke-test-dev:
    name: Smoke test dev
    needs: deploy-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev # for the test user's password, an environment secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The golden path against what was just deployed - a green deploy means the app works, not just that apply exited 0
      - run: npm run test:integration
        env:
          CLOUDCART_API_URL: ${{ needs.deploy-dev.outputs.api_url }}
          CLOUDCART_COGNITO_CLIENT_ID: ${{ needs.deploy-dev.outputs.cognito_client_id }}
          CLOUDCART_TEST_USERNAME: ${{ vars.CLOUDCART_TEST_USERNAME }}
          CLOUDCART_TEST_PASSWORD: ${{ secrets.CLOUDCART_TEST_PASSWORD }}

  # Runs before the approval gate, with no environment, so the reviewer can read the prod plan first.
  # Its token's subject is ref:refs/heads/main, which the deploy role trusts for planning.
  plan-prod:
    name: Plan prod
    needs: smoke-test-dev # prod only moves forward once dev is proven working
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }} # repository secret - stands in for the gitignored local.auto.tfvars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform
        with:
          environment: prod
          apply: "false"
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

  deploy-prod:
    name: Deploy prod
    needs: plan-prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prod # pauses here until a required reviewer approves in the Actions UI
      url: ${{ steps.terraform.outputs.api_url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.terraform.outputs.api_url }}
    env:
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }} # repository secret - stands in for the gitignored local.auto.tfvars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Re-plans rather than applying plan-prod's file: a saved plan holds variable values, and artifacts
      # on a public repo are downloadable by anyone. The summary shows if anything differs from what was approved.
      - id: terraform
        uses: ./.github/actions/terraform
        with:
          environment: prod
          apply: "true"
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

  smoke-test-prod:
    name: Smoke test prod
    needs: deploy-prod
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Prod has no test user and no password login, so check the public contract only
      - name: Public route serves, protected route rejects anonymous calls
        env:
          API_URL: ${{ needs.deploy-prod.outputs.api_url }}
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$@"; }
          products=$(code "$API_URL/products")
          cart=$(code "$API_URL/cart")
          echo "GET /products -> $products (want 200), GET /cart without a token -> $cart (want 401)"
          [ "$products" = "200" ] && [ "$cart" = "401" ]
