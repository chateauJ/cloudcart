  <rect x="168" y="30" width="118" height="210" rx="22" fill="#e6f3fb" fill-opacity=".75" stroke="#9cc4df" stroke-width="3"/>
  <rect x="210" y="40" width="34" height="8" rx="4" fill="#9cc4df"/>
  <path d="M190 120 l46 -46 M196 150 l74 -74 M210 200 l60 -60" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
