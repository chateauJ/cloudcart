<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two tempered glass screen protectors">
  <title>Two tempered glass screen protectors</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf3ea"/><stop offset="1" stop-color="#ead6bf"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a515c"/><stop offset="1" stop-color="#22262d"/></linearGradient>
    <linearGradient id="metalSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#23272e"/><stop offset=".5" stop-color="#4b525d"/><stop offset="1" stop-color="#23272e"/></linearGradient>
    <radialGradient id="glass" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#7fb1ff"/><stop offset=".45" stop-color="#2f5da8"/><stop offset="1" stop-color="#0d1a33"/></radialGradient>
